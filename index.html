<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="نتعلم الحروف ونجمع النجوم — Learn letters, collect stars" />
    <title>نجوم | Nujoom</title>
    <!-- Add to Home Screen (Android + iOS) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="نجوم" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the saved language before first paint so RTL/LTR never flashes.
      try {
        var saved = localStorage.getItem('nujoom.lang')
        if (saved === 'en' || saved === 'ar') {
          document.documentElement.lang = saved
          document.documentElement.dir = saved === 'ar' ? 'rtl' : 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
